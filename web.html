<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width,initial-scale=1">
   <title>Wmsu Merch</title>
   <link rel="stylesheet" href="styles/webstyle.css">
</head>
<body>

<div class="header">
    <h2>Western Mindanao State University</h2>
    <h3>College Merch Store</h3>
</div>

<div class="overlay"></div>

<div class="selection">
    <h3>Select Your College Department</h3>
    <select id="department">
        <option value="">-- Choose Department --</option>
        <option value="engineering">College of Engineering</option>
        <option value="business">College of Business Administration</option>
        <option value="education">College of Teacher Education</option>
        <option value="ccs">College of Computing Studies</option>
        <option value="cswcd">College of Social Work and Community Development</option>
        <option value="ca">College of Architecture</option>
        <option value="cla">College of Liberal Arts</option>
    </select>
</div>

<div class="products" id="productList"></div>

<script>
const productsData = {
  engineering: [
    {img: 'images/eng/geo.jpg', title: 'GE Shirt', price: 350},
    {img: 'images/eng/black.jpg', title: 'GE Shirt', price: 350},
    {img: 'images/eng/white.jpg', title: 'GE Shirt', price: 350},
    {img: 'images/eng/jacket.jpg', title: 'GE Jacket', price: 899},
    {img: 'images/eng/jacket2.jpg', title: 'GE Jacket', price: 899},
    {img: 'images/eng/g1.jpg', title: 'GE Lanyard', price: 99},
    {img: 'images/eng/ce arm.jpg', title: 'GE Arm sleeve', price: 899},
    {img: 'images/eng/stickers.jpg', title: 'GE Stickers', price: 10},
    {img: 'images/eng/cepolo.jpg', title: 'CE Polo', price: 650},
    {img: 'images/eng/ceshirt.jpg', title: 'CE Shirt', price: 400},
    {img: 'images/eng/celanyard.jpg', title: 'CE Lanyard', price: 120},
    {img: 'images/comingsoon.jpg', title: 'CE Cap', price: 250},
    {img: 'images/eng/cebuttonpins.jpg', title: 'CE Button Pins', price: 25}
  ],
  business: [
    {img: 'images/comingsoon.jpg', title: 'CBA Shirt', price: 450},
    {img: 'images/comingsoon.jpg', title: 'CBA Lanyard', price: 99},
    {img: 'images/comingsoon.jpg', title: 'CBA Lanyard', price: 99}
  ],
  education: [
    {img: 'images/comingsoon.jpg', title: 'CTE Shirt', price: 300},
    {img: 'images/comingsoon.jpg', title: 'CTE Lanyard', price: 100},
    {img: 'images/comingsoon.jpg', title: 'CTE Lanyard', price: 99}
  ],
  ccs: [
    {img: 'images/ccs/shirt.jpg', title: 'IT Shirt', price: 350},
    {img: 'images/ccs/sh.jpg', title: 'CS Shirt', price: 350},
    {img: 'images/ccs/lanyard.jpg', title: 'CCS Lanyard', price: 99},
    {img: 'images/ccs/lan.jpg', title: 'CCS Lanyard', price: 99}
  ],
  cswcd: [
    {img: 'images/comingsoon.jpg', title: 'CSWCD Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'CSWCD Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'CSWCD Shirt', price: 350}
  ],
  ca: [
    {img: 'images/comingsoon.jpg', title: 'Archi Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'Archi Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'Archi Shirt', price: 350}
  ],
  cla: [
    {img: 'images/comingsoon.jpg', title: 'CLA Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'CLA Shirt', price: 350},
    {img: 'images/comingsoon.jpg', title: 'CLA Shirt', price: 350}
  ]
};

function showProducts() {
  const dept = document.getElementById('department').value;
  const productList = document.getElementById('productList');
  productList.innerHTML = ''; // clear existing
  if (!dept || !productsData[dept]) return;

  productsData[dept].forEach(function(p) {
    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = encodeURI(p.img);
    img.alt = p.title;
    card.appendChild(img);

    const h4 = document.createElement('h4');
    h4.textContent = p.title;
    card.appendChild(h4);

    const price = document.createElement('p');
    price.className = 'price';
    price.textContent = `₱${p.price}`;
    card.appendChild(price);

    const btn = document.createElement('a');
    btn.textContent = 'Add to Cart';
    btn.href = 'merchant.html';
    btn.className = 'add-to-cart';
    btn.setAttribute('role', 'button');
    card.appendChild(btn);

    productList.appendChild(card);
  });
}

document.addEventListener('DOMContentLoaded', function() {
  var deptSelect = document.getElementById('department');
  if (deptSelect) {
    deptSelect.addEventListener('change', showProducts);
  }
});
</script>

</body>
</html>
