<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Payment Failed</title>
    <link rel="stylesheet" href="styles/failed.css" />
    <style>
        .badge.failed {
            background: linear-gradient(135deg, rgba(255,0,80,0.13), rgba(255,0,0,0.07));
            color: #ff1744;
            border-color: rgba(255,0,80,0.13);
            box-shadow: 0 8px 30px rgba(255,0,80,0.08), inset 0 -6px 18px rgba(0,0,0,0.18);
        }
        .amount.failed {
            color: #ff1744;
            background: linear-gradient(90deg, rgba(255,0,80,0.08), rgba(255,0,0,0.03));
        }
        .confetti.failed span {
            animation: shake 900ms cubic-bezier(.2,.9,.3,1) 1;
            color: #ff1744;
        }
        @keyframes shake {
            0% { transform: translateY(-25vh) rotate(-10deg);}
            20% { transform: translateY(-20vh) rotate(10deg);}
            40% { transform: translateY(-15vh) rotate(-10deg);}
            60% { transform: translateY(-10vh) rotate(10deg);}
            80% { transform: translateY(-5vh) rotate(-10deg);}
            100% { transform: translateY(110vh) rotate(0deg);}
        }
    </style>
</head>
<body>
    <main class="card" role="status" aria-live="polite">
        <div class="badge failed" aria-hidden="true">❌</div>
        <h1>Payment Failed</h1>
        <p class="lead">Sorry — your payment could not be processed.</p>

        <div class="amount failed">Attempted: $42.00</div>

        <div class="actions">
            <a class="btn" href="web.html">Try Again</a>
            <a class="btn" href="#">Contact Support</a>
        </div>

        <div class="confetti failed" aria-hidden="true">
            <span>💥</span><span>💔</span><span>⚠️</span><span>😞</span><span>❗</span>
            <span>💥</span><span>😢</span><span>🚫</span><span>🔒</span>
        </div>

        <div class="stars" aria-hidden="true">
            <i>✦</i><i>✧</i><i>✦</i>
        </div>
    </main>
</body>
</html>
